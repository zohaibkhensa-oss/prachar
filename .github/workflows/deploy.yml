name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

# Required GitHub secrets:
#   AWS_REGION — e.g. ap-south-1
#   AWS_ROLE_ARN — IAM role ARN for OIDC (do NOT use access keys)
#   ECR_REGISTRY — e.g. <account>.dkr.ecr.ap-south-1.amazonaws.com
#   STAGING_PRIVATE_SUBNETS — comma-separated subnet IDs
#   STAGING_SG — security group ID for staging
#   PROD_PRIVATE_SUBNETS — comma-separated subnet IDs
#   PROD_SG — security group ID for production
#
# OIDC setup (do NOT create long-lived access keys):
# 1. Create OIDC identity provider in AWS for GitHub:
#    aws iam create-open-id-connect-provider \
#      --url https://token.actions.githubusercontent.com \
#      --thumbprint-list 6938fd4ed98ff039df5d9b96b9b1c2e1fb1f6f7c \
#      --client-id-list sts.amazonaws.com
# 2. Create IAM role with trust policy:
#    {
#      "Version": "2012-10-17",
#      "Statement": [{
#        "Effect": "Allow",
#        "Principal": {
#          "Federated": "arn:aws:iam::<account>:oidc-provider/token.actions.githubusercontent.com"
#        },
#        "Action": "sts:AssumeRoleWithWebIdentity",
#        "Condition": {
#          "StringEquals": {
#            "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
#          },
#          "StringLike": {
#            "token.actions.githubusercontent.com:sub": "repo:zohaibkhensa-oss/prachar:*"
#          }
#        }
#      }]
#    }
# 3. Attach permissions policy to the role (ECS, ECR, RDS, S3, etc.)
# 4. Store the role ARN as AWS_ROLE_ARN in GitHub secrets

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  # ─── Test gate — must pass before any deployment ────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e packages/shared -e apps/api -e apps/workers
      - name: Lint
        run: ruff check apps/api packages/shared apps/workers
      - name: Run migrations (test DB)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/prachar_test
        run: |
          cd apps/api && alembic upgrade head
      - name: Run tests
        run: pytest apps/api/prachar_api/tests/ packages/shared/prachar_shared/tests/ -x -q

  # ─── Build & push images ────────────────────────────────────────────────────
  build:
    needs: test  # No build without passing tests
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.build-api.outputs.image }}
      web_image: ${{ steps.build-web.outputs.image }}
      worker_image: ${{ steps.build-worker.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # OIDC authentication — no long-lived access keys
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API
        id: build-api
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          IMAGE="${ECR_REGISTRY}/prachar/api:${{ github.sha }}"
          docker build -t "$IMAGE" -f apps/api/Dockerfile .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build & push Web (web-v2)
        id: build-web
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          IMAGE="${ECR_REGISTRY}/prachar/web:${{ github.sha }}"
          docker build -t "$IMAGE" -f apps/web-v2/Dockerfile .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build & push Worker
        id: build-worker
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          IMAGE="${ECR_REGISTRY}/prachar/worker:${{ github.sha }}"
          docker build -t "$IMAGE" -f apps/workers/Dockerfile .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  # ─── Deploy to staging (auto on main push) ─────────────────────────────────
  deploy-staging:
    needs: build  # No deploy without successful build (which requires tests)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Terraform Apply (staging)
        run: |
          cd infra/terraform
          terraform init
          terraform apply -auto-approve \
            -var-file="terraform.tfvars.dev" \
            -var="environment=staging" \
            -var="ecr_api_image=${{ needs.build.outputs.api_image }}" \
            -var="ecr_web_image=${{ needs.build.outputs.web_image }}" \
            -var="ecr_worker_image=${{ needs.build.outputs.worker_image }}"

      - name: Run migrations
        run: |
          aws ecs run-task \
            --cluster prachar-staging \
            --task-definition prachar-migrate \
            --count 1 \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.STAGING_PRIVATE_SUBNETS }}],securityGroups=[${{ secrets.STAGING_SG }}]}"

      - name: Wait for deployment to stabilize
        run: sleep 60

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.curvai.org/health/ready || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying..."
            sleep 15
          done
          echo "Health check failed after 10 attempts"
          exit 1

  # ─── Deploy to production (manual, on tag) ─────────────────────────────────
  deploy-production:
    needs: build  # No deploy without successful build (which requires tests)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Terraform Apply (production)
        run: |
          cd infra/terraform
          terraform init
          terraform apply -auto-approve \
            -var-file="terraform.tfvars.prod" \
            -var="environment=production" \
            -var="ecr_api_image=${{ needs.build.outputs.api_image }}" \
            -var="ecr_web_image=${{ needs.build.outputs.web_image }}" \
            -var="ecr_worker_image=${{ needs.build.outputs.worker_image }}"

      - name: Run migrations
        run: |
          aws ecs run-task \
            --cluster prachar-production \
            --task-definition prachar-migrate \
            --count 1 \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PROD_PRIVATE_SUBNETS }}],securityGroups=[${{ secrets.PROD_SG }}]}"

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.curvai.org/health/ready || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Production health check passed"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying..."
            sleep 15
          done
          echo "Production health check failed"
          exit 1
