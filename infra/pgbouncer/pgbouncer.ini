# PgBouncer configuration for PRACHAR production.
#
# PgBouncer is a connection pooler for Postgres. It sits between the app and
# the database, multiplexing hundreds of app connections onto a small number
# of real DB connections. This prevents "too many connections" errors when
# the API + workers + beat all try to connect at once.
#
# Usage:
#   1. Install PgBouncer: apt install pgbouncer (or use the docker image)
#   2. Copy this file to /etc/pgbouncer/pgbouncer.ini
#   3. Create /etc/pgbouncer/userlist.txt with:
#      "prachar" "md5<hash>"  (generate: echo -n "prachar<password>" | md5sum)
#   4. Start: pgbouncer -d /etc/pgbouncer/pgbouncer.ini
#   5. Point the app at PgBouncer: DATABASE_URL=postgresql+asyncpg://prachar:prachar@localhost:6432/prachar
#   6. Set DB_POOL_SIZE=10 (PgBouncer multiplexes, so the app pool can be small)
#
# In docker-compose, add a pgbouncer service between the app and postgres.

[databases]
prachar = host=127.0.0.1 port=5432 dbname=prachar user=prachar password=prachar

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

# Transaction pooling — connections are returned to the pool after each
# transaction. This gives the best multiplexing ratio. Safe for SQLAlchemy
# async with pool_pre_ping=True.
pool_mode = transaction

# Connection limits — these are the real DB connections PgBouncer opens.
# 50 is enough for ~500 concurrent app connections (10:1 multiplexing).
max_client_conn = 1000
default_db_size = 50
max_db_connections = 50

# Timeouts — drop idle connections so the DB doesn't accumulate them.
server_idle_timeout = 600        # 10 min: close idle server connections
server_lifetime = 3600           # 1 hour: reconnect to refresh server state
query_timeout = 60               # 1 min: kill long-running queries (Celery has its own limits)
query_wait_timeout = 30          # 30 sec: if a client waits >30s for a connection, drop it

# Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

# Auth
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Ignore startup parameters that PgBouncer doesn't support in transaction mode
ignore_startup_parameters = extra_float_digits,search_path
