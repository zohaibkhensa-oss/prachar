[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prachar-shared"
version = "0.1.0"
description = "PRACHAR shared contracts, ai_gateway, adapters, policy"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings",
    "redis>=5",
    "anthropic",
    "openai",
    "httpx",
    "sqlalchemy>=2",
    "cryptography>=50.0.0",
    # transitive via boto3/requests — pin above PYSEC-2026-4175/76/77 fixes
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["prachar_shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["prachar_shared/tests"]
